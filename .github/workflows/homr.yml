name: Audit historical station metadata
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/homr.yml'
      - 'scripts/homr_timing.py'
permissions:
  contents: write
concurrency:
  group: stormlab-homr
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python scripts/homr_timing.py
      - uses: actions/upload-artifact@v4
        with:
          name: station-timing-audit
          path: data/gefs_archive/homr_timing.json
          retention-days: 7
      - name: Publish timing audit
        shell: bash
        run: |
          set -euo pipefail
          staging=$(mktemp)
          trap 'rm -f "$staging"' EXIT
          cp data/gefs_archive/homr_timing.json "$staging"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data/gefs_archive
            cp "$staging" data/gefs_archive/homr_timing.json
            git add data/gefs_archive/homr_timing.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Publish NOAA station metadata timing audit"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
