name: Regional GEFS live shadow prediction
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/regional_live.py'
      - '.github/workflows/regional-live.yml'
permissions:
  contents: write
concurrency:
  group: stormlab-regional-live
  cancel-in-progress: false
jobs:
  inference:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install compatible inference dependencies
        run: pip install numpy==2.2.6 scikit-learn==1.6.1 joblib==1.4.2 requests eccodes
      - name: Fetch live GEFS and evaluate shadow predictions
        run: |
          python -m py_compile scripts/regional_live.py
          python scripts/regional_live.py
      - name: Publish diagnostic results
        shell: bash
        run: |
          set -euo pipefail
          stage=$(mktemp -d)
          trap 'rm -rf "$stage"' EXIT
          cp -a data/regional_live/. "$stage/"
          source_hash=$(git hash-object scripts/regional_live.py)
          train_hash=$(git hash-object data/regional_learning/report.json)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            if [ "$(git hash-object scripts/regional_live.py)" != "$source_hash" ] || [ "$(git hash-object data/regional_learning/report.json)" != "$train_hash" ]; then
              echo "Inference source or trained model report changed; refusing stale publication"
              exit 1
            fi
            mkdir -p data/regional_live
            cp -a "$stage/." data/regional_live/
            git add data/regional_live/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Publish live regional GEFS shadow inference"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
