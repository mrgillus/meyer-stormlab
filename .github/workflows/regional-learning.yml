name: Regional GEFS snowfall learning
on:
  workflow_dispatch:
  schedule:
    - cron: "41 7 * * *"
  push:
    branches: [main]
    paths:
      - 'scripts/regional_learning.py'
      - 'scripts/train_gefs48.py'
      - '.github/workflows/regional-learning.yml'
permissions:
  contents: write
concurrency:
  group: stormlab-regional-learning
  cancel-in-progress: false
jobs:
  train:
    strategy:
      fail-fast: false
      matrix:
        include:
          - script: regional_learning
            output: regional_learning
            archive: gefs_archive
          - script: train_gefs48
            output: regional_learning48
            archive: gefs48
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install training dependencies
        run: pip install numpy==2.2.6 scikit-learn==1.6.1 joblib==1.4.2
      - name: Train and validate against unseen winters
        run: |
          python -m py_compile scripts/regional_learning.py
          python "scripts/${{ matrix.script }}.py"
      - name: Publish benchmark without changing live forecasts
        shell: bash
        run: |
          set -euo pipefail
          stage=$(mktemp -d)
          trap 'rm -rf "$stage"' EXIT
          out="data/${{ matrix.output }}"
          archive="data/${{ matrix.archive }}"
          cp -a "$out/." "$stage/"
          base=$(git rev-parse HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            if ! git diff --quiet "$base" HEAD -- scripts/regional_learning.py scripts/train_gefs48.py "$archive/" data/regional/observations.csv.gz; then
              echo "Training source changed; refusing to publish obsolete experiment."
              exit 1
            fi
            mkdir -p "$out"
            cp -a "$stage/." "$out/"
            git add "$out/"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Publish ${{ matrix.output }} snowfall research benchmark"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
