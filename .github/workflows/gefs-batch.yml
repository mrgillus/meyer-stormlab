name: Expand GEFS historical archive
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/gefs-batch.yml'
      - 'scripts/gefs_parallel.py'
      - 'scripts/gefs_batch.py'
      - 'scripts/regional_archive.py'
      - 'scripts/analog_diagnostic.py'
permissions:
  contents: read
env:
  STORMLAB_ARCHIVE_WORKERS: '16'
concurrency:
  group: stormlab-gefs-batch
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_work: ${{ steps.plan.outputs.has_work }}
      base: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - id: plan
        run: |
          python -m py_compile scripts/gefs_parallel.py scripts/gefs_batch.py scripts/regional_archive.py
          python -c 'import os,sys; sys.path.insert(0,"scripts"); import gefs_parallel as g; g.WORKERS=int(os.environ["STORMLAB_ARCHIVE_WORKERS"]); g.plan()'
      - uses: actions/upload-artifact@v4
        with:
          name: gefs-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: batch-plan.json
          retention-days: 2
  extract:
    needs: plan
    if: needs.plan.outputs.has_work == 'true'
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.base }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'eccodes>=2.40,<3' requests
      - name: Compile independent historical dates
        env:
          BATCH_DATES: ${{ matrix.dates }}
          BATCH_WORKER: ${{ matrix.worker }}
        run: python scripts/gefs_parallel.py worker
      - name: Preserve completed checkpoints even on partial failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gefs-worker-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.worker }}
          path: batch-output/
          retention-days: 2
          if-no-files-found: warn
  publish:
    needs: [plan, extract]
    if: always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - uses: actions/download-artifact@v4
        with:
          name: gefs-plan-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/download-artifact@v4
        with:
          pattern: gefs-worker-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: worker-artifacts
      - name: Validate, combine and publish checkpoints
        env:
          BATCH_BASE: ${{ needs.plan.outputs.base }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            if ! git diff --quiet "$BATCH_BASE" HEAD -- scripts/regional_archive.py scripts/gefs_batch.py scripts/gefs_parallel.py data/gefs_archive/manifest.json; then
              echo "::error::Extraction code or manifest changed. Refusing to mix datasets."
              exit 1
            fi
            python -c 'import os,sys; sys.path.insert(0,"scripts"); import gefs_parallel as g; g.WORKERS=int(os.environ["STORMLAB_ARCHIVE_WORKERS"]); g.publish()'
            # Research diagnostics must never block archive persistence.
            if ! python scripts/analog_diagnostic.py; then
              echo "::warning::Analog diagnostic failed; preserving archive checkpoints."
            fi
            git add data/gefs_archive/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Checkpoint parallel GEFS historical archive"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
