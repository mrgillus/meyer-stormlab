name: Recover historical snowfall clock evidence from ACIS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/acis-clock-audit.yml'
      - 'scripts/acis_clock_audit.py'
      - 'tests/test_acis_clock_audit.py'
permissions:
  contents: write
concurrency:
  group: stormlab-acis-clock-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_acis_clock_audit.py -v
      - run: python scripts/acis_clock_audit.py
      - name: Publish candidate evidence without changing training labels
        run: |
          set -euo pipefail
          stage=$(mktemp -d)
          trap 'rm -rf "$stage"' EXIT
          cp -a data/observation_clocks/acis/. "$stage/"
          hash=$(git hash-object data/regional/observations.csv.gz)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            test "$(git hash-object data/regional/observations.csv.gz)" = "$hash"
            mkdir -p data/observation_clocks/acis
            cp -a "$stage/." data/observation_clocks/acis/
            git add data/observation_clocks/acis/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Publish ACIS snowfall observation clock candidates"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
