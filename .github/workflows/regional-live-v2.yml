name: Regional same-cycle fine-grid GEFS inference
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/regional_live_v2.py'
      - '.github/workflows/regional-live-v2.yml'
permissions:
  contents: write
concurrency:
  group: stormlab-live-v2
  cancel-in-progress: false
jobs:
  inference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scikit-learn==1.6.1 joblib==1.4.2 requests eccodes
      - run: |
          python -m py_compile scripts/regional_live_v2.py
          python scripts/regional_live_v2.py
      - name: Publish fine-grid diagnostic
        shell: bash
        run: |
          set -euo pipefail
          stage=$(mktemp -d)
          trap 'rm -rf "$stage"' EXIT
          cp -a data/regional_live_v2/. "$stage/"
          base=$(git rev-parse HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            if ! git diff --quiet "$base" HEAD -- scripts/regional_live_v2.py scripts/regional_live.py scripts/regional_learning.py data/regional_learning/ data/regional_learning48/; then exit 1; fi
            mkdir -p data/regional_live_v2
            cp -a "$stage/." data/regional_live_v2/
            git add data/regional_live_v2/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Publish same-cycle high-resolution GEFS shadow results"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
