name: Historical snowfall benchmark
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hindcast.yml'
      - 'scripts/hindcast.py'
permissions:
  contents: write
concurrency:
  group: stormlab-hindcast
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install scikit-learn==1.6.1
      - name: Train and evaluate from clean generated output
        run: |
          rm -f data/training/report.json data/training/hindcasts.csv data/training/rf_day*.joblib
          python scripts/hindcast.py
          python - <<'PY'
          import json
          from pathlib import Path
          d = Path("data/training")
          r = json.loads((d / "report.json").read_text())
          assert r["observed_days"] > 0
          assert (d / "hindcasts.csv").stat().st_size > 0
          for lead in r["results"]:
              if lead["status"] == "evaluated":
                  assert (d / ("rf_day%d.joblib" % lead["lead"])).stat().st_size > 0
          PY
      - name: Preserve benchmark outputs even if publication fails
        uses: actions/upload-artifact@v4
        with:
          name: snowfall-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/training/report.json
            data/training/hindcasts.csv
            data/training/rf_day*.joblib
          if-no-files-found: error
          retention-days: 14
      - name: Publish benchmark and matched data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Keep the generated report, dataset and model files together.
          # Rebuild the publication commit on the current remote head on each attempt.
          staging=$(mktemp -d)
          trap 'rm -rf "$staging"' EXIT
          cp data/training/report.json data/training/hindcasts.csv "$staging/"
          shopt -s nullglob
          for f in data/training/rf_day*.joblib; do cp "$f" "$staging/"; done
          trained_source=$(git hash-object scripts/hindcast.py)
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            if [ "$(git hash-object scripts/hindcast.py)" != "$trained_source" ]; then
              echo "::error::Training source changed during this run; outputs preserved as an artifact. Run the latest workflow instead."
              exit 1
            fi
            mkdir -p data/training
            rm -f data/training/rf_day*.joblib
            cp "$staging/"* data/training/
            git add -A -- data/training/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Publish historical snowfall benchmark"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 5))
          done
          echo "::error::Could not publish after five attempts; outputs are available in the workflow artifact."
          exit 1
