name: Historical snowfall benchmark
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hindcast.yml'
      - 'scripts/hindcast.py'
permissions:
  contents: write
concurrency:
  group: stormlab-hindcast
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install scikit-learn==1.6.1
      - run: python scripts/hindcast.py
      - name: Publish benchmark and matched data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/training/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish historical snowfall benchmark"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
